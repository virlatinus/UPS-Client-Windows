name: Release & Build Installers

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g., v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release-installers:
    name: Build, Sign & Publish Windows Installers (.exe & .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version (vX.Y.Z)
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.version }}" -ne "") {
            $Tag = "${{ inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $Tag = "${{ github.ref_name }}"
          } elseif ("${{ github.event.release.tag_name }}" -ne "") {
            $Tag = "${{ github.event.release.tag_name }}"
          } else {
            $Tag = "v1.0.0"
          }
          if (-not $Tag.StartsWith("v")) {
            $Tag = "v$Tag"
          }
          $Numeric = $Tag.TrimStart('v')
          Write-Host "Resolved Tag: $Tag (Numeric: $Numeric)"
          "tag=$Tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "numeric=$Numeric" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Ensure NSIS and WiX Toolset are available
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
          if (-not (Get-Command candle -ErrorAction SilentlyContinue) -and -not $env:WIX) {
            choco install wixtoolset -y --no-progress
          }

      - name: Run unit tests
        run: cargo test --verbose

      - name: Build release binary and Windows installers (.exe and .msi)
        shell: pwsh
        run: |
          .\installer\build-installers.ps1 -Version "${{ steps.version.outputs.tag }}"

      # Required by SignPath to verify artifact origin directly from GitHub servers
      - name: Upload unsigned release artifacts
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: UPS-Client-Windows-${{ steps.version.outputs.tag }}-unsigned
          path: |
            dist/ups-client-windows-${{ steps.version.outputs.tag }}-x86_64.exe
            dist/UPS-Client-Windows-${{ steps.version.outputs.tag }}-x86_64-setup.exe
            dist/UPS-Client-Windows-${{ steps.version.outputs.tag }}-x86_64.msi
            dist/SHA256SUMS.txt

      # Automatically signs artifacts via SignPath.io when SIGNPATH_API_TOKEN is configured
      - name: Check SignPath configuration
        id: signpath-check
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN) -and -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID)) {
            Write-Host "SignPath credentials detected — code signing enabled."
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "SignPath credentials not yet configured — skipping code signing."
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Submit signing request to SignPath.io
        if: steps.signpath-check.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'UPS-Client-Windows' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Refresh SHA256SUMS.txt after code signing
        if: steps.signpath-check.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $DistDir = Join-Path $PWD "dist"
          $ChecksumFile = Join-Path $DistDir "SHA256SUMS.txt"
          $Hashes = @()
          Get-ChildItem -Path $DistDir -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            $Hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $Hashes += "$Hash  $($_.Name)"
          }
          $Hashes | Set-Content -Path $ChecksumFile -Encoding UTF8

      - name: Upload signed release artifacts
        if: steps.signpath-check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: UPS-Client-Windows-${{ steps.version.outputs.tag }}-signed
          path: |
            dist/ups-client-windows-${{ steps.version.outputs.tag }}-x86_64.exe
            dist/UPS-Client-Windows-${{ steps.version.outputs.tag }}-x86_64-setup.exe
            dist/UPS-Client-Windows-${{ steps.version.outputs.tag }}-x86_64.msi
            dist/SHA256SUMS.txt

      - name: Publish binaries and installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/ups-client-windows-${{ steps.version.outputs.tag }}-x86_64.exe
            dist/UPS-Client-Windows-${{ steps.version.outputs.tag }}-x86_64-setup.exe
            dist/UPS-Client-Windows-${{ steps.version.outputs.tag }}-x86_64.msi
            dist/SHA256SUMS.txt
