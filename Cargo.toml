[package]
name = "ups-client-windows"
version = "1.0.0"
edition = "2021"
authors = ["Werner García <werner.garcia@gmail.com>"]
description = "Modern Windows App that monitors any compatible UPS endpoint via HTTP and triggers alerts or actions on specific events"
repository = "https://github.com/virlatinus/UPS-Client-Windows"
license = "MIT"
readme = "README.md"
keywords = ["ups", "windows", "tray", "battery", "monitoring"]
categories = ["gui", "os::windows-apis"]

[package.metadata.wix]
upgrade-guid = "8E4B7C2A-51F9-4D3E-9A1C-7F6B2D8E4A10"
path-guid = "3C9A1E4F-82B5-4C7D-B6E0-1A5F9C3D7E21"
license = false
eula = false

[dependencies]
eframe = { version = "0.29", default-features = true }
tray-icon = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
directories = "5.0"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
winrt-notification = "0.5"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
